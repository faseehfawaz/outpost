# PostgreSQL 16 tuning for the Outpost node.
#
# Hardware assumed:
#   CPU  : Intel 6C/12T, unlocked, always-on
#   RAM  : 32 GB
#   Disk : 512 GB *SATA* SSD  <-- NOT NVMe. This drives several settings below.
#
# Install:
#   cp deploy/postgresql.tuned.conf /var/lib/postgres/data/conf.d/outpost.conf
#   # ensure postgresql.conf ends with:  include_dir = 'conf.d'
#   systemctl restart postgresql
#
# Verify it took:
#   psql -U outpost -c "SHOW shared_buffers; SHOW random_page_cost;"
#
# Baseline for comparison: stock Postgres ships shared_buffers=128MB and
# effective_cache_size=4GB — i.e. it assumes a machine roughly 1/50th the size
# of this one and will happily leave 30 GB of RAM unused.

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# 25% of RAM is the standard starting point for a dedicated DB host. The rest
# is deliberately left to the OS page cache (and to Chromium + the local LLM,
# which share this box).
shared_buffers = 8GB

# Not an allocation — a *hint* to the planner about how much of the DB the OS is
# likely caching. Setting it near total RAM makes the planner correctly prefer
# index scans over sequential scans for this workload.
effective_cache_size = 20GB

# Per sort/hash node, and a query can use several at once. With ~30 concurrent
# connections (pool max 20 + API + psql) 64MB is comfortable: worst realistic
# case is well under 4 GB.
work_mem = 64MB

# Used by CREATE INDEX / VACUUM. Generous here makes the migration-003 index
# builds and autovacuum on the growing `urls` table dramatically faster.
maintenance_work_mem = 2GB

# Postgres 16: caps total memory used by autovacuum workers.
autovacuum_work_mem = 1GB

# ---------------------------------------------------------------------------
# Disk — SATA SSD specific
# ---------------------------------------------------------------------------
# Ratio of random-page cost to sequential-page cost. Stock is 4.0 (spinning
# rust). NVMe is usually tuned to 1.1. A SATA SSD sits between: random reads
# are cheap but the ~550 MB/s sequential ceiling and ~90k IOPS mean random
# access is NOT quite free the way it is on NVMe. 1.5 is the honest number here
# — going to 1.1 would over-encourage index scans this disk cannot feed.
random_page_cost = 1.5
seq_page_cost = 1.0

# How many concurrent I/Os the planner assumes for bitmap heap scans. SATA
# AHCI has a 32-deep command queue; NVMe would justify 200+. Do not copy an
# NVMe value here — it produces queue thrash on SATA.
effective_io_concurrency = 32
maintenance_io_concurrency = 32

# ---------------------------------------------------------------------------
# WAL / checkpoints — the main write-path lever on SATA
# ---------------------------------------------------------------------------
# Ingest writes in large bursts (thousands of upserts per cycle). Small
# max_wal_size forces frequent checkpoints, and checkpoint write storms are
# exactly what a SATA SSD handles worst. Bigger WAL + a long, smooth checkpoint
# spread converts spiky writes into a gentle trickle.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = zstd

wal_buffers = 64MB

# Group commits so bursty ingest writes share an fsync. 2ms of added latency
# per commit is invisible to this workload and cuts fsync count substantially.
commit_delay = 2000
commit_siblings = 5

# NOTE: synchronous_commit stays ON. It is tempting to disable it for ingest
# throughput, but this database IS the work queue and the audit log — losing
# the last ~0.5s of commits on a power cut would mean silently losing claimed
# work and accountability records. Not worth it. If you want the speed for a
# bulk backfill only, set it per-session:  SET LOCAL synchronous_commit = off;
synchronous_commit = on

# ---------------------------------------------------------------------------
# Parallelism — 12 threads available
# ---------------------------------------------------------------------------
max_worker_processes = 12
max_parallel_workers = 12
# Per-query cap. 4 keeps one big analytical query (actor graph, IOC export)
# from monopolising every core while the pipeline is running.
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# Encourage the planner to actually use parallelism — defaults are conservative
# and assume parallel startup is expensive, which it is not on this box.
parallel_setup_cost = 500
parallel_tuple_cost = 0.05
min_parallel_table_scan_size = 8MB

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# Pool max 20 + API + reaper + interactive psql + headroom. Deliberately not
# huge: Postgres performs worse, not better, with hundreds of idle backends.
max_connections = 100

# ---------------------------------------------------------------------------
# Autovacuum — `urls` churns hard (every row is UPDATEd 2-3 times through the
# state machine, and every UPDATE creates a dead tuple)
# ---------------------------------------------------------------------------
autovacuum_max_workers = 4
autovacuum_naptime = 15s
# Stock thresholds (20% of the table) mean a 5M-row urls table waits for 1M
# dead tuples before vacuuming. Far too lazy for a queue table.
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
# SSD: no reason to throttle vacuum I/O the way the spinning-disk defaults do.
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# Log anything slower than a second — with the concurrent pools, a slow query
# is now a genuine bottleneck rather than background noise.
log_min_duration_statement = 1000
log_checkpoints = on
log_autovacuum_min_duration = 0
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
# JIT hurts more than it helps for this query mix (short, indexed, repetitive).
jit = off
timezone = 'UTC'
