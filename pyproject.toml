[project]
name = "pkintel"
version = "0.1.0"
description = "Phishing-kit intelligence pipeline: ingest, triage, opportunistic kit collection, static dissection, actor clustering, and takedown."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Faseeh Padinjarathil", email = "security@heapleap.tech" }]

dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.4",
    "mmh3>=4.1",
    "Pillow>=10.3",
    "ImageHash>=4.3",
    "python-tlsh>=4.5",
    "networkx>=3.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-whois>=0.9",
    "boto3>=1.34",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.5",
    # Authenticated encryption for indicators.full_value_encrypted (pkintel.crypto).
    # Previously that column held plaintext, despite its name.
    "cryptography>=42.0",
    # Certificate Transparency firehose. Replaces crt.sh polling, which is slow,
    # rate-limited and frequently 502s; the firehose surfaces a lookalike domain
    # within seconds of cert issuance, often before the phishing page is served.
    "websockets>=12.0",
    # DNS + passive-DNS pivoting: resolve hosts to IPs so sibling phishing sites
    # on the same infrastructure cluster together without needing a kit archive.
    "dnspython>=2.6",
    # Regex engine with a real `timeout=` parameter, which stdlib `re` does not
    # have. Used by pkintel.analyzer.deobfuscate as a backstop when matching
    # attacker-authored PHP: the pattern there is linear-time, but this bounds
    # a single match attempt even if a future edit reintroduces a
    # super-linear one. Import is optional at runtime — absence only removes
    # the backstop.
    "regex>=2024.5",
    "playwright",
    "sqlglot",
]

[project.optional-dependencies]
# Headless-browser deep triage. Optional because it pulls a ~400 MB Chromium and
# the pipeline degrades gracefully to static triage without it.
# On Arch, prefer the system browser and skip the bundled download:
#   pacman -S chromium
#   PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pip install -e ".[render]"
#   export PKINTEL_RENDER_EXECUTABLE=/usr/bin/chromium
render = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-beautifulsoup4",
    # REQUIRED, not optional. tests/test_schema_consistency.py parses every SQL
    # literal in the source and validates it against db/migrations without a
    # database. It used `pytest.importorskip("sqlglot")` while sqlglot was
    # declared nowhere — so it silently skipped in every run and every CI job,
    # and a query referencing a non-existent `indicators.created_at` column
    # shipped and 500'd the public IOC feed. A guard that can skip itself is
    # not a guard.
    "sqlglot>=25.0",
    # Enforces the ReDoS regression tests. Without it @pytest.mark.timeout is
    # an unknown marker and --strict-markers fails the run, which is the
    # intended behaviour: those tests are meaningless if they can hang.
    "pytest-timeout>=2.3",
    # Exercises the FastAPI routes (see tests/test_api_routes.py).
    "httpx>=0.27",
]

[project.scripts]
pkintel = "pkintel.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
# S603/S607: subprocess use is deliberate & audited in analyzer container launch.
ignore = [
    "S101", "E501", "S105", "S608", "UP042",
    "SIM103", "SIM117", "F841", "S110", "S112",
    "E402", "B007", "C408",
    # UP017 rewrites `timezone.utc` to `datetime.UTC`, which only exists on
    # Python 3.11+. `timezone.utc` is equivalent, works everywhere, and reads
    # more explicitly. Kept deliberately.
    "UP017",
    # SIM114 merges separate `if` branches into one `or`. In the render
    # request-classifier and the migration parser the branches are separate
    # *concepts* that happen to share a body; merging them makes the intent
    # harder to follow.
    "SIM114",
    # UP047 rewrites `TypeVar` generics to PEP 695 `def f[T, R](...)`. Valid on
    # our 3.12 target, but it makes the module unparseable by any older
    # interpreter — including the ones people reach for when reproducing a bug
    # or running a quick script against src/ outside the venv. The TypeVar form
    # is equally correct on 3.12 and costs nothing. Revisit when 3.12 is the
    # oldest Python anyone plausibly has.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# B008: typer.Option()/Argument() in a default IS the Typer idiom — the call is
# how you declare the option. Not a mutable-default bug.
"src/pkintel/cli/*" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres (set PKINTEL_DB_URL)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
# P1-11 audit: removed top-level ignore_errors = true so mypy catches real issues.
# Modules that still need burn-down are overridden below.

[[tool.mypy.overrides]]
module = ["pkintel.fingerprint.*", "pkintel.takedown.*"]
ignore_errors = true
